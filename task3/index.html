<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sleek dark-mode scientific calculator — trigonometry, logarithms, powers, factorial, constants, and full keyboard support." />
  <title>Scientific Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ App Root ═══ -->
  <div class="app-bg">

    <!-- Decorative animated gradient blobs -->
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <!-- ═══ Calculator Card ═══ -->
    <div class="calculator" role="application" aria-label="Scientific Calculator">

      <!-- ── Display Panel ── -->
      <div class="display">

        <!-- Top bar: branding + DEG/RAD toggle -->
        <div class="display__topbar">
          <span class="display__label">SCIENTIFIC</span>
          <!-- Clickable angle-mode pill (also handled in JS) -->
          <button class="deg-rad-pill" id="deg-rad-toggle" data-action="toggle-angle"
                  aria-label="Toggle angle mode between degrees and radians">DEG</button>
        </div>

        <!-- Expression line: shows the full expression being built (scrollable) -->
        <div class="display__expression" id="expression" aria-label="Expression being built"></div>

        <!-- Main number: current digit input or computed result (ARIA live) -->
        <div class="display__main" id="display"
             aria-live="polite" aria-atomic="true"
             aria-label="Current value">0</div>

      </div><!-- /.display -->

      <!-- ── Keypad Grid: 8 columns × 5 rows ── -->
      <!--
        Layout (Desktop 8-col):
        Col 1-4  → Scientific functions
        Col 5-8  → Standard numpad
      -->
      <div class="keypad" role="group" aria-label="Calculator keypad">

        <!-- ════ ROW 1 ════ -->
        <!-- Inverse trig & open paren -->
        <button class="btn btn--sci"  id="btn-asin"  data-action="asin"       aria-label="Inverse sine">sin⁻¹</button>
        <button class="btn btn--sci"  id="btn-acos"  data-action="acos"       aria-label="Inverse cosine">cos⁻¹</button>
        <button class="btn btn--sci"  id="btn-atan"  data-action="atan"       aria-label="Inverse tangent">tan⁻¹</button>
        <button class="btn btn--sci"  id="btn-open"  data-action="open-paren" aria-label="Open parenthesis">(</button>
        <!-- Clear, delete, percent, divide -->
        <button class="btn btn--fn"   id="btn-ac"    data-action="clear"      aria-label="All Clear">AC</button>
        <button class="btn btn--fn"   id="btn-del"   data-action="delete"     aria-label="Delete last">⌫</button>
        <button class="btn btn--op"   id="btn-pct"   data-action="percent"    aria-label="Percent">%</button>
        <button class="btn btn--op"   id="btn-div"   data-action="div"        aria-label="Divide">÷</button>

        <!-- ════ ROW 2 ════ -->
        <!-- Trig & close paren -->
        <button class="btn btn--sci"  id="btn-sin"   data-action="sin"         aria-label="Sine">sin</button>
        <button class="btn btn--sci"  id="btn-cos"   data-action="cos"         aria-label="Cosine">cos</button>
        <button class="btn btn--sci"  id="btn-tan"   data-action="tan"         aria-label="Tangent">tan</button>
        <button class="btn btn--sci"  id="btn-close" data-action="close-paren" aria-label="Close parenthesis">)</button>
        <!-- 7 8 9 × -->
        <button class="btn btn--num"  id="btn-7"     data-action="digit" data-value="7" aria-label="7">7</button>
        <button class="btn btn--num"  id="btn-8"     data-action="digit" data-value="8" aria-label="8">8</button>
        <button class="btn btn--num"  id="btn-9"     data-action="digit" data-value="9" aria-label="9">9</button>
        <button class="btn btn--op"   id="btn-mul"   data-action="mul"         aria-label="Multiply">×</button>

        <!-- ════ ROW 3 ════ -->
        <!-- Log, ln, eˣ, √ -->
        <button class="btn btn--sci"  id="btn-log"   data-action="log"    aria-label="Logarithm base 10">log</button>
        <button class="btn btn--sci"  id="btn-ln"    data-action="ln"     aria-label="Natural logarithm">ln</button>
        <button class="btn btn--sci"  id="btn-exp"   data-action="exp"    aria-label="e to the power x">eˣ</button>
        <button class="btn btn--sci"  id="btn-sqrt"  data-action="sqrt"   aria-label="Square root">√</button>
        <!-- 4 5 6 − -->
        <button class="btn btn--num"  id="btn-4"     data-action="digit" data-value="4" aria-label="4">4</button>
        <button class="btn btn--num"  id="btn-5"     data-action="digit" data-value="5" aria-label="5">5</button>
        <button class="btn btn--num"  id="btn-6"     data-action="digit" data-value="6" aria-label="6">6</button>
        <button class="btn btn--op"   id="btn-sub"   data-action="sub"    aria-label="Subtract">−</button>

        <!-- ════ ROW 4 ════ -->
        <!-- 10ˣ, x², xʸ, ∛ -->
        <button class="btn btn--sci"  id="btn-pow10" data-action="pow10"  aria-label="10 to the power x">10ˣ</button>
        <button class="btn btn--sci"  id="btn-sq"    data-action="square" aria-label="Square">x²</button>
        <button class="btn btn--sci"  id="btn-pow"   data-action="power"  aria-label="Power x to y">xʸ</button>
        <button class="btn btn--sci"  id="btn-cbrt"  data-action="cbrt"   aria-label="Cube root">∛</button>
        <!-- 1 2 3 + -->
        <button class="btn btn--num"  id="btn-1"     data-action="digit" data-value="1" aria-label="1">1</button>
        <button class="btn btn--num"  id="btn-2"     data-action="digit" data-value="2" aria-label="2">2</button>
        <button class="btn btn--num"  id="btn-3"     data-action="digit" data-value="3" aria-label="3">3</button>
        <button class="btn btn--op"   id="btn-add"   data-action="add"    aria-label="Add">+</button>

        <!-- ════ ROW 5 ════ -->
        <!-- π, e, n!, 1/x -->
        <button class="btn btn--sci btn--const" id="btn-pi"   data-action="pi"          aria-label="Pi constant">π</button>
        <button class="btn btn--sci btn--const" id="btn-e"    data-action="euler"        aria-label="Euler's number">e</button>
        <button class="btn btn--sci"            id="btn-fact" data-action="factorial"    aria-label="Factorial">n!</button>
        <button class="btn btn--sci"            id="btn-recip"data-action="reciprocal"   aria-label="One divided by x">1/x</button>
        <!-- +/- 0 . = -->
        <button class="btn btn--num"  id="btn-neg"   data-action="negate"  aria-label="Toggle positive or negative">+/-</button>
        <button class="btn btn--num"  id="btn-0"     data-action="digit" data-value="0" aria-label="0">0</button>
        <button class="btn btn--num"  id="btn-dot"   data-action="decimal" aria-label="Decimal point">.</button>
        <button class="btn btn--eq"   id="btn-eq"    data-action="equals"  aria-label="Equals">=</button>

      </div><!-- /.keypad -->
    </div><!-- /.calculator -->
  </div><!-- /.app-bg -->

  <script src="script.js"></script>
</body>
</html>
